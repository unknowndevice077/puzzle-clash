# Render Blueprint: https://render.com/docs/blueprint-spec
# One Docker web service serving the API, Socket.IO and the built client,
# with a small persistent disk for players and best times.
services:
  - type: web
    name: puzzle-clash
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # Persistent disks need a paid instance. Remove `disk:` to use the free plan.
    region: oregon
    numInstances: 1          # Matches live in memory.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
    disk:
      name: puzzle-data
      mountPath: /app/server/data
      sizeGB: 1
