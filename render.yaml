# Render Blueprint: https://render.com/docs/blueprint-spec
# One Docker web service serving the API, Socket.IO and the built client.
# Free plan: no persistent disk, so the SQLite data is temporary. For permanent data, switch to
# `plan: starter` and add a `disk:` mounted at /app/server/data.
services:
  - type: web
    name: puzzle-clash
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free               # No card needed. Data (players, history) resets when the service restarts or sleeps.
    region: oregon
    numInstances: 1          # Matches live in memory.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
